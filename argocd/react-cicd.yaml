apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: react-cicd-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 
    targetRevision: main
    path: environments/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
