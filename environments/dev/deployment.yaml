apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-cicd-demo
  namespace: dev
  labels:
    app: react-cicd-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: react-cicd-demo
  template:
    metadata:
      labels:
        app: react-cicd-demo
    spec:
      containers:
        - name: react-cicd-demo
          image: your-dockerhub-username/react-cicd-demo:INITIAL_TAG
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      